// Teil 2 ergänzt Rechenlogik, Generator, Prüfen und Lösungen.

// ------------------------------
// Bruchfunktionen
// ------------------------------

function ggt(a, b) {
    a = Math.abs(a);
    b = Math.abs(b);

    while (b !== 0) {
        let h = b;
        b = a % b;
        a = h;
    }

    return a;
}

function kuerzen(z, n) {

    if (n < 0) {
        z *= -1;
        n *= -1;
    }

    const g = ggt(z, n);

    return {
        z: z / g,
        n: n / g
    };
}

function add(b1, b2) {

    return kuerzen(
        b1.z * b2.n + b2.z * b1.n,
        b1.n * b2.n
    );

}

function sub(b1, b2) {

    return kuerzen(
        b1.z * b2.n - b2.z * b1.n,
        b1.n * b2.n
    );

}

function mul(b1, b2) {

    return kuerzen(
        b1.z * b2.z,
        b1.n * b2.n
    );

}

function divi(b1, b2) {

    return kuerzen(
        b1.z * b2.n,
        b1.n * b2.z
    );

}

function leseBruch(text) {

    text = text.replace(/\s/g, "");

    // Ganze Zahl?
    if (!text.includes("/")) {

        const z = parseInt(text);

        if (isNaN(z))
            return null;

        return { z:z, n:1 };
    }

    const teile = text.split("/");

    if (teile.length !== 2)
        return null;

    const z = parseInt(teile[0]);
    const n = parseInt(teile[1]);

    if (isNaN(z) || isNaN(n) || n === 0)
        return null;

    return { z, n };
}


// ------------------------------
// Ergebnis vergleichen
// ------------------------------

function pruefeAntwort(eingabe, loesung) {

    if (eingabe === null)
        return "falsch";

    // mathematisch gleich?

    if (eingabe.z * loesung.n !== loesung.z * eingabe.n)
        return "falsch";

    const g = ggt(eingabe.z, eingabe.n);

    if (g === 1)
        return "perfekt";

    return "kuerzen";

}

    ],
    ["·", "=", "·", "=", "="],
    {0:"gruen", 2:"gruen"}
    );

} else {

    html += pizzaZeile(
    [
        pizzaBlock(texte[aktivSprache].pz.bruch1,bruch1.z,bruch1.n,undefined,undefined,undefined,b1Mehrfach),
        pizzaBlock(texte[aktivSprache].pz.bruch2,bruch2.z,bruch2.n,undefined,undefined,undefined,b2Mehrfach),
        pizzaBlock(texte[aktivSprache].pz.produkt,bruch1.z*bruch2.z,bruch1.n*bruch2.n),
        pizzaBlock(texte[aktivSprache].pz.gekuerzt,mal.z,mal.n)
    ],
    ["·", "=", "="],
    {0:"gruen"}
    );

}

html+="<hr class=\"pizzaTrenner\">";

html+="<h2 class=\"pz-h-div\">"+texte[aktivSprache].pz.div+"</h2>";

html += pizzaZeile(
[
    pizzaBlock(texte[aktivSprache].pz.bruch1,bruch1.z,bruch1.n,undefined,undefined,undefined,b1Mehrfach),
    pizzaBlock(texte[aktivSprache].pz.bruch2,bruch2.z,bruch2.n,"blau",null,false,b2Mehrfach),
    pizzaBlock(texte[aktivSprache].pz.bruch1,bruch1.z,bruch1.n,undefined,undefined,undefined,b1Mehrfach),
    pizzaBlock(texte[aktivSprache].pz.kehrwert,bruch2.n,bruch2.z,"gruen",null,false),
    pizzaBlock(texte[aktivSprache].pz.quotient,bruch1.z*bruch2.n,bruch1.n*bruch2.z),
    pizzaBlock(texte[aktivSprache].pz.gekuerzt,geteilt.z,geteilt.n)
],
[":", "=", "·", "=", "="],
{0:"blau", 2:"gruen"}
);

html+="<hr class=\"pizzaTrenner\">";

html+="<h2 class=\"pz-h-add\">"+texte[aktivSprache].pz.add+"</h2>";

html += pizzaZeile(
[
    pizzaBlock(texte[aktivSprache].pz.bruch1,bruch1.z,bruch1.n,null,nennerFarbe(bruch1.n),undefined,b1Mehrfach),
    pizzaBlock(texte[aktivSprache].pz.bruch2,bruch2.z,bruch2.n,null,nennerFarbe(bruch2.n),undefined,b2Mehrfach),
    pizzaBlock(texte[aktivSprache].pz.gleich1,e1,h,null,nennerFarbe(h)),
    pizzaBlock(texte[aktivSprache].pz.gleich2,e2,h,null,nennerFarbe(h)),
    pizzaBlock(texte[aktivSprache].pz.summe,e1+e2,h),
    pizzaBlock(texte[aktivSprache].pz.gekuerzt,plus.z,plus.n)
],
["+", "=", "+", "=", "="],
{0:"gelb", 2:"gelb"}
);

html+="<hr class=\"pizzaTrenner\">";

html+="<h2 class=\"pz-h-sub\">"+texte[aktivSprache].pz.sub+"</h2>";

html += pizzaZeile(
[
    pizzaBlock(texte[aktivSprache].pz.bruch1,bruch1.z,bruch1.n,null,nennerFarbe(bruch1.n),undefined,b1Mehrfach),
    pizzaBlock(texte[aktivSprache].pz.bruch2,bruch2.z,bruch2.n,null,nennerFarbe(bruch2.n),undefined,b2Mehrfach),
    pizzaBlock(texte[aktivSprache].pz.gleich1,e1,h,null,nennerFarbe(h)),
    pizzaBlock(texte[aktivSprache].pz.gleich2,e2,h,null,nennerFarbe(h)),
    pizzaBlock(texte[aktivSprache].pz.differenz,e1-e2,h),
    pizzaBlock(texte[aktivSprache].pz.gekuerzt,minus.z,minus.n)
],
["−", "=", "−", "=", "="],
{0:"lila", 2:"lila"}
);



    document.getElementById("pizzaInhalt").innerHTML=html;

    document.getElementById("pizzaModal").style.display="block";

};



function pizzaSchliessenFn(){
    document.getElementById("pizzaModal").style.display="none";
}

document.getElementById("pizzaSchliessen").onclick=pizzaSchliessenFn;
document.getElementById("pizzaSchliessenUnten").onclick=pizzaSchliessenFn;

document.getElementById("pizzaModal").onclick=function(e){

    if(e.target===this)
        this.style.display="none";

};

document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){
        const modal=document.getElementById("pizzaModal");
        if(modal.style.display==="block"){
            modal.style.display="none";
        }
    }
});
