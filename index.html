}

.konfetti{

to{

// Teil 2 ergänzt Rechenlogik, Generator, Prüfen und Lösungen.

// ------------------------------
// Bruchfunktionen
// ------------------------------

function ggt(a, b) {
    a = Math.abs(a);
    b = Math.abs(b);

    while (b !== 0) {
        let h = b;
        b = a % b;
        a = h;
    }

    return a;
}

function kuerzen(z, n) {

    if (n < 0) {
        z *= -1;
        n *= -1;
    }

    const g = ggt(z, n);

    return {
        z: z / g,
        n: n / g
    };
}

function add(b1, b2) {

    return kuerzen(
        b1.z * b2.n + b2.z * b1.n,
        b1.n * b2.n
    );

}

function sub(b1, b2) {

    return kuerzen(
        b1.z * b2.n - b2.z * b1.n,
        b1.n * b2.n
    );

}

function mul(b1, b2) {

    return kuerzen(
        b1.z * b2.z,
        b1.n * b2.n
    );

}

function divi(b1, b2) {

    return kuerzen(
        b1.z * b2.n,
        b1.n * b2.z
    );

}

    const f = brueche();
    let p=f[0], m=f[0], ml=f[0], d=f[0];
    for (let i=1;i<f.length;i++){
        p=add(p,f[i]); m=sub(m,f[i]); ml=mul(ml,f[i]); d=divi(d,f[i]);
    }
    return {plus:p, minus:m, mal:ml, geteilt:d};
}

function vorzeichenNorm(z, n){
    return n < 0 ? { z: -z, n: -n } : { z: z, n: n };
}

function leseEigeneZahl(id, leerWert){
    const t = document.getElementById(id).value.replace(/\s/g,"").replace(/[−–]/g,"-");
    if (t === "" ) return leerWert;
    if (!/^-?\d{1,3}$/.test(t)) return null;
    return parseInt(t, 10);
}

function eigenerBruch(gId, zId, nId){
    const t = id => document.getElementById(id).value.replace(/\s/g,"").replace(/[−–]/g,"-");
    const gMinus = t(gId).startsWith("-");
    const zMinus = t(zId).startsWith("-");
    const g = leseEigeneZahl(gId, 0);
    const z = leseEigeneZahl(zId, null);
    const n = leseEigeneZahl(nId, 1);
    if (g === null || z === null || n === null || n < 1) return null;
    // "-0" im Feld zählt auch als Minus
    const neg = gMinus || zMinus;
    const gA = Math.abs(g), zA = Math.abs(z);
    const vz = neg ? -1 : 1;
    if (gA > 0) {
        return { z: vz*(gA*n + zA), n: n, ganz: gA, restZ: zA, neg: neg };
    }
    return { z: vz*zA, n: n, mehrfach: zA > n };
}

        return false;

    bruch1 = b1;

    return true;
}

function neueBrueche() {

    let liste;

    if (stufe === "eigene") {
        if (!uebernimmEigene()) return;
        zeigeAufgaben();
        return;
    }

    if (stufe === "leicht")
        liste = leicht;

    if (stufe === "mittel")
        liste = mittel;

    if (stufe === "kuerzen")
        liste = kuerzenAufgaben;

    if (stufe === "gemischt")
        liste = gemischt;

    const p = liste[Math.floor(Math.random()*liste.length)];

    if (stufe === "gemischt") {

        // Gemischte Zahl -> unechter Bruch für die Rechnung,
        // ganz/restZ werden nur für die Anzeige gebraucht
        bruch1 = {
            z: p.g1 * p.n1 + p.z1,
            n: p.n1,
            ganz: p.g1,
            restZ: p.z1
        };

        bruch2 = {
            z: p.g2 * p.n2 + p.z2,
            n: p.n2,
            ganz: p.g2,
            restZ: p.z2
        };

    } else {

        bruch1 = {
            z:p.z1,
            n:p.n1
        };

        bruch2 = {
            z:p.z2,
            n:p.n2
        };

    }

bruch3 = null;

if (dreiBrueche) {

    // dritten Bruch aus einer anderen zufälligen Aufgabe derselben Stufe nehmen
    let q = p;
    for (let versuch = 0; versuch < 10 && q === p; versuch++)
        q = liste[Math.floor(Math.random()*liste.length)];

    const k = Math.random() < 0.5 ? 1 : 2;

    if (stufe === "gemischt") {
        const g = k === 1 ? q.g1 : q.g2;
        const zz = k === 1 ? q.z1 : q.z2;
        const nn = k === 1 ? q.n1 : q.n2;
        bruch3 = { z: g*nn + zz, n: nn, ganz: g, restZ: zz };
    } else {
        bruch3 = { z: k === 1 ? q.z1 : q.z2, n: k === 1 ? q.n1 : q.n2 };
    }

} else if (bruch1.z * bruch2.n > bruch2.z * bruch1.n) {
    // Für Subtraktion meist negatives Ergebnis erzeugen
    [bruch1, bruch2] = [bruch2, bruch1];
}

zeigeAufgaben();

}

function leseBruch(text) {

    text = text.replace(/\s/g, "");

    // Ganze Zahl?
    if (!text.includes("/")) {

        const z = parseInt(text);

        if (isNaN(z))
            return null;

        return { z:z, n:1 };
    }

    const teile = text.split("/");

    if (teile.length !== 2)
        return null;

    const z = parseInt(teile[0]);
    const n = parseInt(teile[1]);

    if (isNaN(z) || isNaN(n) || n === 0)
        return null;

    return { z, n };
}

function pruefeAntwort(eingabe, loesung) {

    if (eingabe === null)
        return "falsch";

    // mathematisch gleich?

    if (eingabe.z * loesung.n !== loesung.z * eingabe.n)
        return "falsch";

    const g = ggt(eingabe.z, eingabe.n);

    if (g === 1)
        return "perfekt";

    return "kuerzen";

}

let loesungSichtbar = false;

document.getElementById("loesung").onclick = function () {

    if(loesungSichtbar){

        document.querySelectorAll(".schritt").forEach(f=>f.value="");

        ["plus","minus","mal","geteilt"].forEach(id=>{
            document.getElementById(id).value="";
        });

        document.querySelectorAll("main input").forEach(f=>{
            f.style.background="white";
            f.style.color="black";
        });

        loesungSichtbar=false;
        return;
    }

    const erg = ergebnisse();
    const l1 = erg.plus;
    const l2 = erg.minus;
    const l3 = erg.mal;
    const l4 = erg.geteilt;
    const f = brueche();

    function ausgabe(b){
        return b.n===1 ? String(b.z) : b.z+"/"+b.n;
    }

    // Ergebnisse
    document.getElementById("plus").value = ausgabe(l1);
    document.getElementById("minus").value = ausgabe(l2);
    document.getElementById("mal").value = ausgabe(l3);
    document.getElementById("geteilt").value = ausgabe(l4);

    // -----------------------
    // Multiplikation
    // -----------------------

    function klammer(x){ return x < 0 ? "(" + x + ")" : String(x); }

    function kgV(a,b){
        return a*b/ggt(a,b);
    }

    const prodZ = f.reduce((a,b)=>a*b.z, 1);
    const prodN = f.reduce((a,b)=>a*b.n, 1);

    document.getElementById("mal1").value =
        f.map(b=>klammer(b.z)).join("·")+" / "+f.map(b=>b.n).join("·");

    document.getElementById("mal2").value = prodZ+"/"+prodN;

    // -----------------------
    // Division
    // -----------------------

    const rest = f.slice(1);
    const kws = rest.map(b => vorzeichenNorm(b.n, b.z));
    const quZ = f[0].z * rest.reduce((a,b)=>a*b.n, 1);
    const quN = f[0].n * rest.reduce((a,b)=>a*b.z, 1);
    const qu = vorzeichenNorm(quZ, quN);

    document.getElementById("geteilt1").value =
        klammer(f[0].z)+"/"+f[0].n + kws.map(k=>" · "+k.z+"/"+k.n).join("");

    document.getElementById("geteilt2").value = qu.z+"/"+qu.n;

    // -----------------------
    // Addition / Subtraktion
    // -----------------------

    const h = f.reduce((a,b)=>kgV(a,b.n), 1);
    const es = f.map(b => b.z * (h / b.n));
    const term = (e,i) => (i === 0 ? e : klammer(e)) + "/" + h;

    document.getElementById("plus1").value = es.map(term).join(" + ");
    document.getElementById("plus2").value = es.reduce((a,b)=>a+b, 0) + "/" + h;

    document.getElementById("minus1").value = es.map(term).join(" - ");
    document.getElementById("minus2").value = es.slice(1).reduce((a,b)=>a-b, es[0]) + "/" + h;

    document.querySelectorAll("main input").forEach(f=>{
        f.style.background="#66bb6a";
        f.style.color="white";
    });

loesungSichtbar = true;

};

document.addEventListener("keydown", function(e){

    const el = e.target;
    if (!el || el.tagName !== "INPUT") return;
    if (!["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(e.key)) return;

    // Links/Rechts nur am Textrand wechseln, sonst Cursor normal bewegen
    if (e.key === "ArrowLeft" && el.selectionStart !== 0) return;
    if (e.key === "ArrowRight" && el.selectionEnd !== el.value.length) return;

    const r0 = el.getBoundingClientRect();
    const cx = r0.left + r0.width/2, cy = r0.top + r0.height/2;

    let bester = null, besterWert = Infinity;

    document.querySelectorAll("input").forEach(function(c){
        if (c === el || c.offsetParent === null) return;
        const r = c.getBoundingClientRect();
        const dx = (r.left + r.width/2) - cx;
        const dy = (r.top + r.height/2) - cy;

        let haupt, quer;
        if (e.key === "ArrowRight") { if (dx <= 5) return; haupt = dx; quer = Math.abs(dy); }
        if (e.key === "ArrowLeft")  { if (dx >= -5) return; haupt = -dx; quer = Math.abs(dy); }
        if (e.key === "ArrowDown")  { if (dy <= 5) return; haupt = dy; quer = Math.abs(dx); }
        if (e.key === "ArrowUp")    { if (dy >= -5) return; haupt = -dy; quer = Math.abs(dx); }

        const wert = haupt + 3*quer;
        if (wert < besterWert) { besterWert = wert; bester = c; }
    });

    if (bester) {
        e.preventDefault();
        bester.focus();
        bester.select();
    }
});

function blinkRueckmeldung(input, loesung) {

    if (input.value.trim() === "")
        return;

    const eingabe = leseBruch(input.value);
    const status = pruefeAntwort(eingabe, loesung);

    let farbe;
    let textFarbe;

    if (status === "perfekt") {
        farbe = "#66bb6a";
        textFarbe = "white";
    } else if (status === "kuerzen") {
        farbe = "#ffeb3b";
        textFarbe = "black";
    } else {
        farbe = "#ef5350";
        textFarbe = "white";
    }

    const alteBg = input.style.background;
    const alteFarbe = input.style.color;

    input.style.background = farbe;
    input.style.color = textFarbe;

    setTimeout(function () {
        input.style.background = alteBg || "white";
        input.style.color = alteFarbe || "black";
    }, 600);

}

function pizzaMehrfachHTML(z, n){

    const neg = z < 0;
    z = Math.abs(z);
    const mehrfach = Math.floor(z / n);
    const rest = z % n;

    let html = `<div style="display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center;width:80px;margin:0 auto;">`;

    for(let i=0; i<mehrfach; i++){
        html += pizzaEinzelSVG(n, n, neg);
    }

    if(rest > 0){
        html += pizzaEinzelSVG(rest, n, neg);
    }

    if(mehrfach === 0 && rest === 0){
        html += pizzaEinzelSVG(0, n);
    }

    html += `</div>`;

    return html;

}

function pizzaBlock(titel,z,n,farbe,nennerKlasse,unterstreichen,mehrfach){

    const klasse = farbe ? "pizzaKarte pizzaKarte-"+farbe : "pizzaKarte";
    const istNegativ = z < 0;
    const zAbs = Math.abs(z);
    const nennerHtml = nennerKlasse ? `<span class="${nennerKlasse}" style="font-size:18px;font-weight:bold;line-height:1;">${n}</span>` : n;
    const wrapperStil = "display:inline-flex;align-items:center;margin-bottom:4px;" +
        (unterstreichen ? "border-bottom:2px solid #333;padding-bottom:2px;" : "");

    return `
    <div class="${klasse}">

        <div style="${wrapperStil}">
            ${istNegativ ? '<span style="font-size:20px;font-weight:bold;margin-right:3px;">&minus;</span>' : ''}
            <div style="display:inline-flex;flex-direction:column;">
                <div style="text-align:center;font-size:18px;font-weight:bold;line-height:1;">${zAbs}</div>
                <div style="height:2px;background:#000;margin:3px 0;"></div>
                <div style="text-align:center;font-size:18px;font-weight:bold;line-height:1;">${nennerHtml}</div>
            </div>
        </div>

        ${(n > 48 || Math.ceil(zAbs/n) > 12) ? `<div style="height:85px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#777;">${texte[aktivSprache].zuviel}</div>` : (mehrfach ? pizzaMehrfachHTML(z,n) : pizzaSVG(z,n))}

        <div style="
            margin-top:4px;
            font-size:13px;
            font-weight:bold;
        ">
            ${titel}
        </div>

    </div>`;
}

function pizzaZeile(elemente, zeichen, hlMap){

    hlMap = hlMap || {};

    let html = `<div class="pizzaZeile">`;

    for(let i=0;i<elemente.length;i++){

        html += elemente[i];

        if(i < zeichen.length){
            let klasse = "trenner";
            if(zeichen[i] === "=") klasse += " trenner-eq";
            if(hlMap[i]) klasse += " trenner-hl-" + hlMap[i];
            html += `<div class="${klasse}">${zeichen[i]}</div>`;
        }
    }

    html += `</div>`;

    return html;
}


function pizzaDreiHTML(){

    const T = texte[aktivSprache].pz;
    const f = brueche();
    const mf = f.map(b => b.ganz !== undefined || !!b.mehrfach);

    const erg = ergebnisse();
    const h = f.reduce((a,b)=>a*b.n/ggt(a,b.n), 1);
    const es = f.map(b => b.z * (h/b.n));

    const farben = ["nenner-2","nenner-3"];
    const zuordnung = {};
    zuordnung[h] = "nenner-1";
    let fi = 0;
    f.forEach(b => { if(!(b.n in zuordnung)){ zuordnung[b.n] = farben[fi % 2]; fi++; } });
    const nf = n => zuordnung[n] || "nenner-1";

    const orig = (mitFarbe) => f.map((b,i) =>
        pizzaBlock(T["bruch"+(i+1)] || (i+1)+". Bruch", b.z, b.n, null, mitFarbe ? nf(b.n) : undefined, undefined, mf[i]));

    let html = "";

    // Multiplikation
    html += "<h2 class=\"pz-h-mul\">"+T.mul+"</h2>";
    const pZ = f.reduce((a,b)=>a*b.z,1), pN = f.reduce((a,b)=>a*b.n,1);
    html += pizzaZeile(
        orig(false).concat([pizzaBlock(T.produkt,pZ,pN), pizzaBlock(T.gekuerzt,erg.mal.z,erg.mal.n)]),
        ["·","·","=","="].slice(0,f.length-1).concat(["=","="]),
        {0:"gruen",1:"gruen"}
    );
    html += "<hr class=\"pizzaTrenner\">";

    // Division
    html += "<h2 class=\"pz-h-div\">"+T.div+"</h2>";
    html += pizzaZeile(orig(false), [":",":"].slice(0,f.length-1), {0:"blau",1:"blau"});
    const kw = f.slice(1).map(b => vorzeichenNorm(b.n,b.z));
    const quo = vorzeichenNorm(f[0].z*f.slice(1).reduce((a,b)=>a*b.n,1), f[0].n*f.slice(1).reduce((a,b)=>a*b.z,1));
    html += pizzaZeile(
        [pizzaBlock(T.bruch1,f[0].z,f[0].n,undefined,undefined,undefined,mf[0])]
            .concat(kw.map((k,i)=>pizzaBlock(T.kehrwert,k.z,k.n,"gruen"))),
        ["·","·"].slice(0,f.length-1),
        {0:"gruen",1:"gruen"}
    ).replace(/<\/div>$/, "") +
    '<div class="trenner trenner-eq">=</div>' + pizzaBlock(T.quotient,quo.z,quo.n) +
    '<div class="trenner trenner-eq">=</div>' + pizzaBlock(T.gekuerzt,erg.geteilt.z,erg.geteilt.n) + "</div>";
    html += "<hr class=\"pizzaTrenner\">";

    // Addition und Subtraktion
    [["add","+","summe","gelb","plus"],["sub","−","differenz","lila","minus"]].forEach(function(t, idx){
        html += "<h2 class=\"pz-h-"+t[0]+"\">"+T[t[0]]+"</h2>";
        html += pizzaZeile(orig(true), [t[1],t[1]].slice(0,f.length-1), {0:t[3],1:t[3]});
        const gl = es.map((e,i)=>pizzaBlock(T["gleich"+(i+1)] || (i+1)+". gleichnamig", e, h, null, nf(h)));
        const ergZ = t[0]==="add" ? es.reduce((a,b)=>a+b,0) : es.slice(1).reduce((a,b)=>a-b, es[0]);
        html += pizzaZeile(gl, [t[1],t[1]].slice(0,f.length-1), {0:t[3],1:t[3]}).replace(/<\/div>$/, "") +
            '<div class="trenner trenner-eq">=</div>' + pizzaBlock(T[t[2]], ergZ, h) +
            '<div class="trenner trenner-eq">=</div>' + pizzaBlock(T.gekuerzt, erg[t[4]].z, erg[t[4]].n) + "</div>";
        if (idx === 0) html += "<hr class=\"pizzaTrenner\">";
    });

    return html;
}

    document.getElementById("pizzaModal").style.display="block";

};



function pizzaSchliessenFn(){
    document.getElementById("pizzaModal").style.display="none";
}

document.getElementById("pizzaSchliessen").onclick=pizzaSchliessenFn;
document.getElementById("pizzaSchliessenUnten").onclick=pizzaSchliessenFn;

document.getElementById("pizzaModal").onclick=function(e){

    if(e.target===this)
        this.style.display="none";

};

document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){
        const modal=document.getElementById("pizzaModal");
        if(modal.style.display==="block"){
            modal.style.display="none";
        }
    }
});
